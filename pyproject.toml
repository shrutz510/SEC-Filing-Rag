[project]
name = "sec-filing-rag"
version = "0.1.0"
description = "Hybrid RAG + Knowledge Graph assistant over SEC filings."
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Shruti Wagle", email = "shrutigwagle@gmail.com" }]
license = { text = "MIT" }

dependencies = [
    # LangChain core + integrations
    "langchain>=0.3.7",
    "langchain-core>=0.3.15",
    "langchain-community>=0.3.5",
    "langchain-text-splitters>=0.3.2",
    "langchain-neo4j>=0.1.1",
    "langchain-chroma>=0.1.4",
    "langchain-ollama>=0.2.0",         # free default
    "langchain-openai>=0.2.5",         # paid alt
    "langchain-anthropic>=0.2.4",      # paid alt
    "langgraph>=0.2.45",

    # Stores
    "chromadb>=0.5.18",
    "neo4j>=5.25.0",

    # SEC ingestion
    "sec-edgar-downloader>=5.0.3",
    "beautifulsoup4>=4.12.3",
    "lxml>=5.3.0",

    # Modeling / utils
    "pydantic>=2.9.2",
    "pydantic-settings>=2.6.1",
    "tenacity>=9.0.0",
    "python-dotenv>=1.0.1",
    "rapidfuzz>=3.10.1",
    "pyyaml>=6.0.2",
    "rich>=13.9.4",
    "typer>=0.13.0",

    # API + UI
    "streamlit>=1.40.0",
    "pyvis>=0.3.2",

    # Tracing (optional)
    "langsmith>=0.1.142",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.2",
    "mypy>=1.13.0",
]
eval = [
    "ragas>=0.2.6",
    "pandas>=2.2.3",
]

[project.scripts]
sec-filing-rag = "sec_filing_rag.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sec_filing_rag"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
